<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" /> -->
  <title>Bafia Online</title>
  <style>
    body {
      -webkit-overflow-scrolling: touch;
      background-color: rgb(36, 36, 36);
      margin: 0;
      overflow: hidden;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      zoom: 1.5
    }
    .win {
      color: white;
      /* outline: 1px solid white; */
      /* border-radius: 9px; */
      box-shadow: 0 0 20px 10px rgba(0, 0, 0, 0.2);
      & > .content {
        background-color: black;
        overflow: auto;
      }
    }
    .titleBar {
      color: black;
      height: 20px;
      width: 100%;
      --tw-gradient-from: #EAE8EA;
      --tw-gradient-to: #D3D1D3;
      --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
      background: linear-gradient(to bottom, var(--tw-gradient-stops));
      border-radius: 7px 7px 0 0;
      border: 1px solid #B7B6B7;
      position: relative;
      z-index: 1;
      user-select: none;
      display: grid;
      align-items: center;
      grid-template: "start title end";
      grid-template-columns: .5fr 2fr .5fr;
      &.dark {
        color: white;
        --tw-gradient-from: #282828;
        --tw-gradient-to: #282828;
        border: 1px solid #282828;
      }
      & > .title {
        width: 100%;
        height: 100%;
        margin: 0;
        text-align: center;
        display: flex;
        font-size: 12px;
        align-items: center;
        flex-direction: column-reverse;
        justify-content: center
      }
      & > .btns {
        display: flex;
        list-style: none;
        gap: 6px;
        grid-area: start;
        justify-content: start;
        padding-inline-start: 7px;
        margin: 0;
        & > li {
          display: flex;
          justify-content: center;
          align-items: center;
          border-radius: 9px;
          width: 9px;
          height: 9px;
        }
        & > .closeBtn {
          background: #ff605c;
          background-size: 35px 23px;
          background-position: 0 0;
          outline: 0.25px solid #f55653;
          &:disabled {
            background: gray;
            outline: 0.25px solid #646464
          }
        }
        & > .minBtn {
          background: #ffbd44;
          background-size: 35px 22.5px;
          background-position: 57.5px 0px;
          outline: 0.25px solid #f2b23c;
          &:disabled {
            background: gray;
            outline: 0.25px solid #646464
          }
        }
        & > .maxBtn {
          background: #00ca4e;
          background-size: 35px 22.5px;
          background-position: 10px 0;
          outline: 0.25px solid #00ca4e;
          &:disabled {
            background: gray;
            outline: 0.25px solid #646464
          }
        }
      }
    }

    button {
      --tw-gradient-from: rgba(255, 255, 255);
      --tw-gradient-to: rgba(255, 255, 255);
      --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
      display: inline-block;
      font: inherit;
      color: ButtonText;
      text-align: center;
      cursor: default;
      outline: none;
      background: linear-gradient(to bottom, var(--tw-gradient-stops));
      box-sizing: border-box;
      box-shadow: 0px 0px 1px 1px rgb(0 0 0 / 0.12), 0px 1px 2px 0px rgb(0 0 0 / 0.12), 0px 0.5px 1px 0px rgb(0 0  / 0.24);
      border-radius: 0.25rem;
      border: none;
      font-size: 0.7rem;
      padding-top: 0.125rem;
      padding-bottom: 0.125rem;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      &:active {
        --tw-gradient-from: rgb(220 220 220);
        --tw-gradient-to: rgb(210 210 210);
      }
      &:disabled {
        --tw-gradient-from: #474747 !important;
        --tw-gradient-to: #474747 !important;
        color: #9e9e9e !important;
      }
    }

    @keyframes open{
      0% {
        opacity: 0.4;
        transform: scale(.9);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.025)
      }
      100% {
        opacity: 1;
        transform: scale(1)
      }
    }
    @keyframes close {
      0% {
        opacity: 1;
        transform: scale(1)
      }
      100% {
        opacity: 0;
        transform: scale(0.9)
      }
    }
    @keyframes closeOpacity {
      0% {
        opacity: 1
      }
      100% {
        opacity: 0
      }
    }
    @keyframes zoom-in-zoom-out {
      0% {
        transform: scale(0);
      }
      100% {
        transform: scale(1);
      }
    }
    @keyframes opacity {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
